[project]
name = "eqd-desk"
version = "0.2.0"
description = "EQD Desk: an equity-index derivatives trader training simulator (greeks lab, strategy builder, exotics, market-making simulator)."
readme = "README.md"
authors = [{ name = "Alix Bernal", email = "pro.alixbernal@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["options", "black-scholes", "greeks", "derivatives", "streamlit", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Education",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
    "altair>=6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "streamlit>=1.64.0",
]

[project.urls]
Homepage = "https://github.com/ALX-7777/eqd-desk"
Repository = "https://github.com/ALX-7777/eqd-desk"
Issues = "https://github.com/ALX-7777/eqd-desk/issues"
Documentation = "https://github.com/ALX-7777/eqd-desk/blob/main/docs/TRADING_GUIDE.md"

[project.scripts]
eqd-desk = "eqd_desk.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Streamlit reads secrets from the entrypoint's own `.streamlit/` directory too
# (src/eqd_desk/app/.streamlit/), next to the theme that DOES ship. Never package a local
# secrets file: source-exclude applies to the sdist and to the wheel.
source-exclude = ["**/.streamlit/secrets.toml"]

# ---------------------------------------------------------------------------- tools

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "PT",       # pytest style
  "NPY",      # numpy
  "PERF",     # perf anti-patterns
  "RUF",      # ruff-specific
]
ignore = [
  # Greek letters and math symbols (σ, Δ, −, ×) are deliberate in docstrings: the code is
  # meant to be read next to the formulas it implements.
  "RUF001", "RUF002", "RUF003",
  # "Yoda condition" heuristic treats any UPPERCASE name as a constant, so it misfires on
  # the finance convention of single-letter variables (S, K, T): `i.S <= K` is not Yoda.
  "SIM300",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "slow: Monte-Carlo heavy tests (deselect with '-m \"not slow\"')",
  "app: Streamlit AppTest UI smoke tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["eqd_desk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
scripts = [
    "yfinance>=1.7.0",
]
