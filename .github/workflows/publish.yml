name: Publish image

# Builds a multi-arch (amd64 + arm64) image and pushes it to GitHub Container Registry:
#   docker run --rm -p 8501:8501 ghcr.io/alx-7777/eqd-desk:latest
#
# Reusable: only CI (ci.yml) calls it, after lint, types, tests and the Docker smoke test all
# passed, for a push to main (:latest, :sha-…) or a v* tag (:X.Y.Z, :X.Y). To publish by hand,
# run the CI workflow on main ("Run workflow").
#
# One-time setup: a new GHCR package is PRIVATE. Make it public (Package settings > Change
# visibility) so that anyone can `docker run` it.

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
