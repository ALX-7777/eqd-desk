name: Deploy React app to GitHub Pages

# The original React/TypeScript app is a static site: publish it on GitHub Pages so it runs
# in any browser (phone included) with no server: https://alx-7777.github.io/eqd-desk/
#
# Reusable: only CI (ci.yml) calls it, after every check passed on main. To redeploy by hand,
# run the CI workflow on main ("Run workflow").
#
# One-time setup: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time, and never cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
